[project]
name = "pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pillow>=13.0.0",
    "whiteboard-animator",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.uv.sources]
whiteboard-animator = { path = "../vendor/whiteboard-animator", editable = true }
